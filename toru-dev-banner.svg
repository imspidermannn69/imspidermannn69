<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>TORU.DEV — One Piece anime developer banner</title>
<desc>A pirate-themed developer banner for Toru, blending One Piece aesthetics with coding and technology.</desc>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap');
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
@keyframes pulse { 0%,100%{opacity:0.7} 50%{opacity:1} }
.float { animation: float 3s ease-in-out infinite; }
.float2 { animation: float 4s ease-in-out infinite 0.8s; }
.float3 { animation: float 3.5s ease-in-out infinite 1.5s; }
.pulse { animation: pulse 2s ease-in-out infinite; }
</style>

<defs>
  <clipPath id="banner-clip"><rect width="680" height="320" rx="12"/></clipPath>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a0520"/>
    <stop offset="40%" stop-color="#1a0a40"/>
    <stop offset="70%" stop-color="#2d1060"/>
    <stop offset="100%" stop-color="#1a1560"/>
  </linearGradient>
  <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0e2a5c"/>
    <stop offset="100%" stop-color="#060e2a"/>
  </linearGradient>
  <linearGradient id="ship-hull" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3d2a10"/>
    <stop offset="100%" stop-color="#1e1208"/>
  </linearGradient>
  <linearGradient id="panel-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a2040" stop-opacity="0.92"/>
    <stop offset="100%" stop-color="#050d20" stop-opacity="0.92"/>
  </linearGradient>
  <linearGradient id="holo-blue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#0060a0" stop-opacity="0.05"/>
  </linearGradient>
  <linearGradient id="mast-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2a1a08"/>
    <stop offset="50%" stop-color="#5a3a18"/>
    <stop offset="100%" stop-color="#2a1a08"/>
  </linearGradient>
  <linearGradient id="sail-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f0e8c8"/>
    <stop offset="100%" stop-color="#c8b870"/>
  </linearGradient>
  <filter id="glow-gold">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="stars" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="5" cy="8" r="0.8" fill="#ffffff" opacity="0.8"/>
    <circle cx="22" cy="3" r="0.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="35" cy="15" r="1" fill="#ffffff" opacity="0.9"/>
    <circle cx="12" cy="28" r="0.6" fill="#ffe8a0" opacity="0.7"/>
    <circle cx="30" cy="32" r="0.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="18" cy="18" r="0.4" fill="#a0d0ff" opacity="0.8"/>
    <circle cx="8" cy="36" r="0.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="38" cy="6" r="0.6" fill="#ffd080" opacity="0.7"/>
  </pattern>
</defs>

<g clip-path="url(#banner-clip)">
<rect width="680" height="320" fill="url(#sky)"/>
<rect width="680" height="320" fill="url(#stars)" opacity="0.9"/>

<ellipse cx="520" cy="80" rx="220" ry="60" fill="#ff6b00" opacity="0.08"/>
<ellipse cx="520" cy="80" rx="160" ry="45" fill="#ff9a3c" opacity="0.1"/>
