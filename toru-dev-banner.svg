  <text x="10" y="35" font-family="Share Tech Mono, monospace" font-size="8.5" fill="#50e080">JavaScript</text>
  <rect x="82" y="27" width="56" height="6" rx="3" fill="#0a2040"/>
  <rect x="82" y="27" width="50" height="6" rx="3" fill="#50e080" opacity="0.8"/>
  <text x="10" y="50" font-family="Share Tech Mono, monospace" font-size="8.5" fill="#50e080">Laravel</text>
  <rect x="82" y="42" width="56" height="6" rx="3" fill="#0a2040"/>
  <rect x="82" y="42" width="44" height="6" rx="3" fill="#00c8ff" opacity="0.8"/>
  <text x="10" y="65" font-family="Share Tech Mono, monospace" font-size="8.5" fill="#50e080">Vue.js</text>
  <rect x="82" y="57" width="56" height="6" rx="3" fill="#0a2040"/>
  <rect x="82" y="57" width="46" height="6" rx="3" fill="#a060ff" opacity="0.8"/>
  <text x="10" y="80" font-family="Share Tech Mono, monospace" font-size="8.5" fill="#50e080">MySQL</text>
  <rect x="82" y="72" width="56" height="6" rx="3" fill="#0a2040"/>
  <rect x="82" y="72" width="38" height="6" rx="3" fill="#ffa040" opacity="0.8"/>
  <text x="10" y="95" font-family="Share Tech Mono, monospace" font-size="7.5" fill="#00c8ff" opacity="0.7">STATUS: LEVELING UP...</text>
  <rect x="0" y="30" width="148" height="2" fill="#00c8ff" opacity="0.3">
    <animate attributeName="y" values="24;84;24" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>

<g class="float2" transform="translate(520, 50)">
