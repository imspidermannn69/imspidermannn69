  <path d="M0 20 Q85 0 170 20 Q255 38 340 20 Q425 2 510 20 Q595 38 680 20 L680 40 L0 40 Z" fill="#0a1430" opacity="0.9"/>
  <path d="M0 28 Q85 10 170 28 Q255 44 340 28 Q425 12 510 28 Q595 44 680 28 L680 40 L0 40 Z" fill="#050a20" opacity="0.9"/>
</g>
