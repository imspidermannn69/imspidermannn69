  <circle cx="38" cy="11" r="4" fill="#50e080"/>
  <text x="74" y="15" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="9" fill="#a060ff" opacity="0.9">CREW_STATS.log</text>
  <text x="10" y="36" font-family="Share Tech Mono, monospace" font-size="8" fill="#a0b8d0">commits</text>
  <text x="138" y="36" text-anchor="end" font-family="Share Tech Mono, monospace" font-size="8" fill="#ffd700">9,999+</text>
  <text x="10" y="50" font-family="Share Tech Mono, monospace" font-size="8" fill="#a0b8d0">repos</text>
  <text x="138" y="50" text-anchor="end" font-family="Share Tech Mono, monospace" font-size="8" fill="#50e080">loading...</text>
  <text x="10" y="64" font-family="Share Tech Mono, monospace" font-size="8" fill="#a0b8d0">streak</text>
  <text x="138" y="64" text-anchor="end" font-family="Share Tech Mono, monospace" font-size="8" fill="#ff9a3c">BLAZING</text>
  <text x="10" y="78" font-family="Share Tech Mono, monospace" font-size="8" fill="#a0b8d0">class</text>
  <text x="138" y="78" text-anchor="end" font-family="Share Tech Mono, monospace" font-size="8" fill="#00c8ff">CAPTAIN</text>
  <line x1="8" y1="86" x2="140" y2="86" stroke="#a060ff" stroke-width="0.4" opacity="0.5"/>
  <text x="10" y="98" font-family="Share Tech Mono, monospace" font-size="8" fill="#a0b8d0">bounty</text>
  <text x="138" y="98" text-anchor="end" font-family="Share Tech Mono, monospace" font-size="8" fill="#ffd700">∞ BELI</text>
  <text x="74" y="112" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="7" fill="#a060ff" opacity="0.6">[ GRAND LINE CREW ]</text>
</g>

<g class="float" transform="translate(516, 192)">
  <rect x="0" y="0" width="152" height="88" rx="6" fill="url(#panel-bg)" stroke="#ffa040" stroke-width="0.8" opacity="0.95"/>
  <line x1="0" y1="20" x2="152" y2="20" stroke="#ffa040" stroke-width="0.5" opacity="0.6"/>
  <circle cx="10" cy="10" r="3.5" fill="#ff5f5f"/>
  <circle cx="22" cy="10" r="3.5" fill="#ffc060"/>
  <circle cx="34" cy="10" r="3.5" fill="#50e080"/>
  <text x="76" y="14" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8.5" fill="#ffa040" opacity="0.9">TREASURE_LOG.md</text>
  <text x="10" y="33" font-family="Share Tech Mono, monospace" font-size="8" fill="#ffd700">const captain = {</text>
  <text x="16" y="45" font-family="Share Tech Mono, monospace" font-size="8" fill="#a0b8d0">  name: <tspan fill="#50e080">"Toru"</tspan>,</text>
  <text x="16" y="57" font-family="Share Tech Mono, monospace" font-size="8" fill="#a0b8d0">  debug: <tspan fill="#50e080">"console.log"</tspan>,</text>
  <text x="16" y="69" font-family="Share Tech Mono, monospace" font-size="8" fill="#a0b8d0">  goal: <tspan fill="#ff9a3c">"King of Code"</tspan></text>
  <text x="10" y="81" font-family="Share Tech Mono, monospace" font-size="8" fill="#ffd700">}</text>
</g>

<g filter="url(#glow-gold)">
  <text x="340" y="178" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="52" font-weight="900" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.2">TORU.DEV</text>
  <text x="340" y="178" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="52" font-weight="900">
    <tspan fill="#ffd700">TORU</tspan><tspan fill="#ffffff" opacity="0.6">.</tspan><tspan fill="#00c8ff">DEV</tspan>
  </text>
</g>
<text x="340" y="198" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="11" fill="#a9b1d6" letter-spacing="4">FULL STACK DEVELOPER  ·  GRAND LINE</text>

