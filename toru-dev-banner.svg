  <rect x="35" y="115" width="170" height="20" rx="2" fill="#2a1a08"/>
  <rect x="90" y="30" width="8" height="85" fill="url(#mast-grad)"/>
  <rect x="110" y="45" width="6" height="75" fill="url(#mast-grad)" opacity="0.7"/>
  <path d="M94 32 L94 82 L140 60 Z" fill="url(#sail-grad)" opacity="0.9"/>
  <path d="M112 47 L112 88 L148 72 Z" fill="url(#sail-grad)" opacity="0.75"/>
  <line x1="94" y1="32" x2="160" y2="55" stroke="#8a7040" stroke-width="1" opacity="0.8"/>
  <line x1="94" y1="82" x2="148" y2="72" stroke="#8a7040" stroke-width="0.8" opacity="0.7"/>
  <rect x="105" y="14" width="20" height="14" rx="2" fill="#cc2020"/>
  <circle cx="115" cy="21" r="5" fill="#ffffff"/>
  <circle cx="115" cy="21" r="2" fill="#cc2020"/>
  <rect x="130" y="92" width="60" height="38" rx="3" fill="#2a1808"/>
  <rect x="133" y="95" width="10" height="16" rx="1" fill="#d4a060"/>
  <rect x="145" y="95" width="10" height="16" rx="1" fill="#c49050" opacity="0.5"/>
  <rect x="133" y="113" width="22" height="14" rx="1" fill="#c09040"/>
</g>

<g class="float3" transform="translate(8, 58)">
  <rect x="0" y="0" width="148" height="98" rx="6" fill="url(#panel-bg)" stroke="#00c8ff" stroke-width="0.8" opacity="0.95"/>
  <rect x="0" y="0" width="148" height="98" rx="6" fill="url(#holo-blue)"/>
  <line x1="0" y1="22" x2="148" y2="22" stroke="#00c8ff" stroke-width="0.5" opacity="0.6"/>
