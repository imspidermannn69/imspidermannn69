<circle cx="520" cy="72" r="16" fill="#ffffff" opacity="1"/>
<ellipse cx="520" cy="72" rx="60" ry="18" fill="#ffcc40" opacity="0.25"/>
<ellipse cx="520" cy="72" rx="100" ry="12" fill="#ffa020" opacity="0.15"/>

<path d="M0 230 Q40 218 80 228 Q120 238 160 222 Q200 210 240 225 Q280 238 320 220 Q360 205 400 222 Q440 238 480 220 Q520 205 560 222 Q600 238 640 220 L680 225 L680 320 L0 320 Z" fill="url(#ocean)"/>
<path d="M-80 240 Q-40 230 0 240 Q40 250 80 235 Q120 222 160 235 Q200 248 240 232 Q280 218 320 235 Q360 250 400 232 Q440 218 480 235 Q520 250 560 232 L640 240 L680 240 L680 320 L0 320 Z" fill="#0e2a5c" opacity="0.7">
  <animateTransform attributeName="transform" type="translate" values="0 0;80 0;0 0" dur="8s" repeatCount="indefinite"/>
</path>
<path d="M0 258 Q30 248 60 258 Q90 268 120 252 Q150 238 180 252 Q210 265 240 250 Q270 236 300 252 Q330 266 360 250 Q390 236 420 252 Q450 266 480 250 Q510 236 540 252 Q570 266 610 252 L680 255 L680 320 L0 320 Z" fill="#0a1e45" opacity="0.8"/>

